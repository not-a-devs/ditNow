[project]
name = "ditnow-api"
version = "0.1.0"
description = "DIT NOW FastAPI foundation"
requires-python = ">=3.13,<3.14"
dependencies = [
  "ditnow-chatbot[standalone]",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "aiomysql==0.3.2",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "pymysql>=1.2.3,<1.3",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["aiosqlite>=0.21,<1", "httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.uv.sources]
ditnow-chatbot = { path = "../../chatbot", editable = true }

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
